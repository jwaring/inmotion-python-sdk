#
# A Continuous Integration service to build the Python SDK and deploy new versions of the API and UI to GitHub Container Registry.
#
name: sdk-to-ghcr

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v3

      - name: Extract versions
        run: |
          SDK_VERSION=`grep 'version =' pyproject.toml | cut -d = -f 2 | tr -d '[ "]'`
          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inmotion-python-sdk:${{ env.SDK_VERSION }}
            ghcr.io/${{ github.repository_owner }}/inmotion-python-sdk:latest
