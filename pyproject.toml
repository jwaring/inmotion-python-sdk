[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inmotion"
version = "0.2.1"
description = "An SDK for integrating with inMotion API"
authors = [{ name = "Jason Waring", email = "jason@softwaringsolutions.com" }]
license = { text = "MIT" }
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
          "pycryptodome",
          "python-dotenv",
          "requests",
          "marshmallow",
          "marshmallow_dataclass"]
classifiers = [
          "License :: OSI Approved :: MIT License",
          "Programming Language :: Python :: 3",
          "Programming Language :: Python :: 3 :: Only",
          "Intended Audience :: Developers",
          "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest", "tox", "pdoc"]

[project.scripts]
inmotion-smoke-test = "scripts.test:main"

[tool.hatch.build]
include = ["inmotion"]
