[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inmotion"
version = "0.2.0"
description = "An SDK for integrating with inMotion API"
authors = [{ name = "Jason Waring", email = "jason@softwaringsolutions.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
          "numpy",
          "pycryptodome",
          "python-dotenv",
          "pandas",
          "requests"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["pytest", "tox"]

[project.scripts]
test = "scripts.test:main"

[tool.hatch.build]
include = ["inmotion"]
