[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inmotion-python-sdk"
version = "0.1.0"
description = "An SDK for integrating with inMotion API"
authors = [{ name = "Jason Waring", email = "jason@softwaringsolutions.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
          "numpy",
          "pycryptodome",
          "python-dotenv",
          "pandas",
          "requests"]

[project.optional-dependencies]
dev = ["pytest", "tox"]

#[project.scripts]
#your-package = "your_package.main:main"

[tool.hatch.build]
include = ["src/imnotion"]
